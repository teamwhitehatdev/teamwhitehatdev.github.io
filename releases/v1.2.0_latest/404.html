<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // TARGET_NODE_NOT_FOUND - WHITE HAT DEV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f0ff;
      --secondary: #fcee0a;
      --accent: #ff0055;
      --bg: #0d0f18;
    }
    body {
      background-color: var(--bg);
      color: var(--primary);
      font-family: 'Share Tech Mono', monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .scanlines {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }
    .hud-box {
      border: 2px solid var(--primary);
      background: rgba(0, 0, 0, 0.85);
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
      max-width: 550px;
      width: 90%;
      position: relative;
    }
    .glitch-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px var(--primary), 0 0 20px var(--accent);
      margin-bottom: 0.5rem;
    }
    .status-badge {
      display: inline-block;
      border: 1px solid var(--secondary);
      color: var(--secondary);
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
      background: rgba(252, 238, 10, 0.1);
    }
    p {
      color: #d1d5db;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .signature {
      color: #6b7280;
      font-size: 0.75rem;
      margin-top: 1.5rem;
      border-top: 1px solid rgba(0,240,255,0.2);
      padding-top: 0.8rem;
    }
    .btn-home {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      box-shadow: 0 0 15px var(--primary);
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: var(--secondary);
      box-shadow: 0 0 20px var(--secondary);
      transform: scale(1.05);
    }
  </style>
  <script>
    // Disable Right Click & Developer Shortcuts
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
      }
    });

    // GitHub Pages Single Page App Route Fallback Redirect
    var pathSegmentsToKeep = 1;
    var l = window.location;
    if (l.pathname.split('/').length > pathSegmentsToKeep + 1) {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }
  </script>
</head>
<body>
  <div class="scanlines"></div>
  <div class="hud-box">
    <div class="glitch-header">404 :: ERROR</div>
    <div class="status-badge">TELEMETRY NODE NOT FOUND</div>
    <p>The requested route or node URL is missing in the White Hat Dev primary matrix network.</p>
    <a href="./" class="btn-home">RETURN TO MAIN TERMINAL</a>
    <div class="signature">ENCRYPTION SIGNATURE: TeamWhiteHat-PinoyUnknown</div>
  </div>
</body>
</html>
